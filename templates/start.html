<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в игру</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-wrapper">
        <div class="quiz-top-banner">
            <div class="banner-placeholder">🎮 Режим Лобби: Ожидание запуска игры учителем...</div>
        </div>
        <div class="block-orange" style="margin-top: 20px;">
            <h1 class="quiz-title-display">{{ title }}</h1>
            <p class="subtitle">Введите имя и займите место в комнате ожидания.</p>
        </div>
        <div class="block-green" style="margin-top: 20px;">
            <form method="POST">
                <div class="input-group">
                    <label for="username">Ваш игровой никнейм:</label>
                    <input type="text" id="username" name="username" placeholder="Например: Никита_10Б" required>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 20px; background-color: #007bff; width: 100%;">
                    🚀 ПОДКЛЮЧИТЬСЯ К КЛАССУ
                </button>
            </form>
        </div>
    </div>
</body>
</html>
